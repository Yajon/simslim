name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to add a Homebrew bottle to
        required: true
        type: string

# One release per tag: a re-run queues behind the first one instead of racing
# it in the publish job.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  SIMSLIM_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  app:
    name: macOS app bundles
    runs-on: macos-26
    timeout-minutes: 30
    if: github.event_name == 'push'
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build universal app plus one bundle per architecture
        run: |
          VERSION="${SIMSLIM_RELEASE_TAG}" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" \
            make app ARCHS=all
      - name: Verify bundles
        run: |
          test "$(plutil -extract CFBundleVersion raw build/SimSlim.app/Contents/Info.plist)" = "${GITHUB_RUN_NUMBER}"
          test "$(build/SimSlim.app/Contents/Resources/simslim --version)" = "simslim ${SIMSLIM_RELEASE_TAG}"
          for bundle in build/SimSlim*.app; do
            codesign --verify --deep --strict --verbose=2 "$bundle"
            plutil -lint "$bundle/Contents/Info.plist"
            echo "$bundle app=$(lipo -archs "$bundle/Contents/MacOS/SimSlim") cli=$(lipo -archs "$bundle/Contents/Resources/simslim")"
          done
      - name: Verify localized CLI in every bundle
        run: |
          # A thin bundle has its own CLI slice; check each one so a bad lipo
          # or a missing translation table cannot slip into just one artifact.
          for bundle in build/SimSlim*.app; do
            cli="$bundle/Contents/Resources/simslim"
            SIMSLIM_LANG=zh-Hans "$cli" --help | grep -F '用法' >/dev/null
            SIMSLIM_LANG=zh-Hans "$cli" profiles | grep -F '小组件与壁纸' >/dev/null
            SIMSLIM_LANG=en "$cli" --help | grep -F 'USAGE' >/dev/null
            en_json="$(SIMSLIM_LANG=en "$cli" profiles --json)"
            zh_json="$(SIMSLIM_LANG=zh-Hans "$cli" profiles --json)"
            test "$en_json" = "$zh_json"
            echo "$bundle: CLI localization OK"
          done
      - name: Package
        run: |
          cd build
          for bundle in SimSlim*.app; do
            name="${bundle%.app}"
            case "$name" in
              SimSlim) label=universal ;;
              *) label="${name#SimSlim-}" ;;
            esac
            ditto -c -k --sequesterRsrc --keepParent "$bundle" \
              "SimSlim-${SIMSLIM_RELEASE_TAG}-macos-${label}.zip"
          done
          ls -lh SimSlim-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/SimSlim-*.zip
          if-no-files-found: error

  cli:
    name: CLI tarball
    runs-on: macos-14
    timeout-minutes: 15
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          go test ./...
          go build -ldflags "-X main.version=${SIMSLIM_RELEASE_TAG#v}" -o simslim ./cmd/simslim
          codesign --force --sign - simslim
          tar -czf "simslim-${SIMSLIM_RELEASE_TAG}-macos-arm64.tar.gz" simslim
          shasum -a 256 "simslim-${SIMSLIM_RELEASE_TAG}-macos-arm64.tar.gz"
      - name: Verify localized CLI
        run: |
          # Validate the signed binary that actually goes into the tarball.
          SIMSLIM_LANG=zh-Hans ./simslim --help | grep -F '用法' >/dev/null
          SIMSLIM_LANG=zh-Hans ./simslim profiles | grep -F '小组件与壁纸' >/dev/null
          SIMSLIM_LANG=en ./simslim --help | grep -F 'USAGE' >/dev/null
          en_json="$(SIMSLIM_LANG=en ./simslim profiles --json)"
          zh_json="$(SIMSLIM_LANG=zh-Hans ./simslim profiles --json)"
          test "$en_json" = "$zh_json"
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: simslim-*-macos-arm64.tar.gz
          if-no-files-found: error

  bottle:
    name: Homebrew bottle
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Homebrew bottle
        run: |
          SIMSLIM_SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${SIMSLIM_RELEASE_TAG}.tar.gz"
          SIMSLIM_SOURCE_TARBALL="${RUNNER_TEMP}/simslim-source.tar.gz"
          SIMSLIM_BUILD_TAP="mobai-app/simslim-release"

          curl --fail --location --retry 3 "${SIMSLIM_SOURCE_URL}" --output "${SIMSLIM_SOURCE_TARBALL}"
          SIMSLIM_SOURCE_SHA256="$(shasum -a 256 "${SIMSLIM_SOURCE_TARBALL}" | cut -d ' ' -f 1)"

          brew tap-new --no-git "${SIMSLIM_BUILD_TAP}"
          SIMSLIM_FORMULA="$(brew --repository "${SIMSLIM_BUILD_TAP}")/Formula/simslim.rb"
          mkdir -p "$(dirname "${SIMSLIM_FORMULA}")"
          sed \
            -e "s|@SOURCE_URL@|${SIMSLIM_SOURCE_URL}|g" \
            -e "s|@SOURCE_SHA256@|${SIMSLIM_SOURCE_SHA256}|g" \
            packaging/homebrew/simslim.rb.in > "${SIMSLIM_FORMULA}"

          brew install --build-bottle "${SIMSLIM_BUILD_TAP}/simslim"
          brew test "${SIMSLIM_BUILD_TAP}/simslim"
          brew bottle \
            --json \
            --no-rebuild \
            --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${SIMSLIM_RELEASE_TAG}" \
            "${SIMSLIM_BUILD_TAP}/simslim"

          # brew uses a double dash locally; custom HTTP bottle URLs use one.
          for SIMSLIM_BOTTLE in simslim--*.bottle*.tar.gz; do
            mv "${SIMSLIM_BOTTLE}" "${SIMSLIM_BOTTLE/--/-}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bottle
          path: simslim-*.bottle*.tar.gz
          if-no-files-found: error

  # Collects everything the build jobs produced and publishes it as one release,
  # so the tag carries the app bundles, the CLI tarball and the bottle together.
  publish:
    name: Publish release
    needs: [app, cli, bottle]
    # Publishes whatever the build jobs managed to produce: one failed artifact
    # (a flaky bottle, say) must not withhold the app bundles from the release.
    if: ${{ !cancelled() && (needs.app.result == 'success' || needs.cli.result == 'success' || needs.bottle.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum the assets
        run: |
          cd dist
          test -n "$(ls -A)" || { echo "No release artifacts were produced." >&2; exit 1; }
          # A manual run only refreshes the bottle, so it must not replace the
          # complete manifest written by the tag build with a bottle-only one.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            sha256sum * > SHA256SUMS.txt
          fi
          ls -l
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SIMSLIM_RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*
